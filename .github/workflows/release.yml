# Builds UnVaultLauncher.exe and puts it in a draft release, for a person to check and publish.
# Release: set <Version> in Directory.Build.props, push, then Actions > Release > Run workflow.
# The draft keeps the commit it was built from; GitHub tags that commit (e.g. v0.3.1) when the release is published.
# Building runs other people's code (NuGet packages, the tests), so that job can only read the repository. The two small
# jobs around it run none of that: one checks the version, the other records where the exe was built (a signed
# attestation; the exe itself isn't code-signed) and makes the draft.
# Actions are pinned to a commit, not a tag: a tag can be moved to other code, a commit can't. Dependabot proposes updates.
name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only build and test, without making a release (the exe is kept as a download of the run)
        type: boolean
        default: false

# One release at a time: two runs could both pass the check that the version isn't released yet.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: write  # only to see draft releases, which GitHub lists just to those who can write; nothing is built here
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: Directory.Build.props
          sparse-checkout-cone-mode: false

      - name: Version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          $version = (Select-Xml -Path Directory.Build.props -XPath '//Version').Node.InnerText
          $tag = "v$version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          # Each version is released once: a second run would make a duplicate draft or point at another commit.
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name'
          git ls-remote --exit-code --tags origin "refs/tags/$tag" | Out-Null
          if ($LASTEXITCODE -eq 0 -or $releases -contains $tag) {
              $problem = "$tag already has a release or a tag. Raise <Version> in Directory.Build.props, or delete the old draft or tag on GitHub."
              if ($env:DRY_RUN -eq 'true') { Write-Warning $problem } else { throw $problem }
          }
          $global:LASTEXITCODE = 0
          "$tag from commit $env:GITHUB_SHA"

  build:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test UnVault.sln -c Release

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish Source/App -p:PublishProfile=win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # A missing profile is only a warning to dotnet publish; it then builds something else, without the exe.
          if (-not (Test-Path UnVaultLauncher.exe)) { throw "The publish didn't produce UnVaultLauncher.exe; see its warnings above." }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: UnVaultLauncher
          path: UnVaultLauncher.exe
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [version, build]
    if: ${{ !inputs.dry_run }}
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write      # create the draft release
      id-token: write      # sign the build provenance
      attestations: write  # store it with the repository
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: UnVaultLauncher

      - name: Release notes
        shell: pwsh
        run: |
          $hash = (Get-FileHash UnVaultLauncher.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          # The release's own story goes above this, written in the draft before publishing.
          @"
          ***
          **Download** ``UnVaultLauncher.exe`` below: one file, nothing to install, for 64-bit Windows 10 or 11.
          Not code-signed yet, so Windows may warn on first run: choose **More info**, then **Run anyway**.

          **SHA-256** ``$hash``
          **Built by GitHub Actions from this repository.** To check: ``gh attestation verify UnVaultLauncher.exe --repo $env:GITHUB_REPOSITORY``
          "@ | Out-File notes.md -Encoding utf8

      # A signed record that the exe came from this workflow and commit (checked with gh attestation verify).
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: UnVaultLauncher.exe

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$env:TAG" UnVaultLauncher.exe --draft --target "$env:GITHUB_SHA"
          --title "UnVault Launcher $env:VERSION" --notes-file notes.md --repo "$env:GITHUB_REPOSITORY"
